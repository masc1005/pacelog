name: CI/CD Pipeline (Deploy Staging)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # CI/CD: Quality Checks, Tests, Build & Automated Deployments
  # =========================================================================
  build-and-deploy:
    name: 🚀 Build, Test & Deploy (Staging)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ⚡ Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: 📦 Install Dependencies
        run: |
          pnpm approve-builds --all || true
          pnpm install --frozen-lockfile

      - name: 🔍 Typecheck (All Packages)
        run: pnpm typecheck

      - name: 🧪 Run Tests (Vitest)
        run: pnpm test

      - name: 🏗️ Build All Packages (Turborepo)
        run: pnpm build

      - name: ⚡ Deploy Frontend PWA (Cloudflare Pages)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ./node_modules/.bin/wrangler pages deploy apps/frontend/dist --project-name=pacelog-staging --branch=main --commit-dirty=true

      - name: 🚂 Deploy Backend API (Railway)
        if: github.ref == 'refs/heads/main'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          ./node_modules/.bin/railway up --service pacelog-api --detach || true
