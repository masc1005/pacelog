<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1923;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#40FFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C8E0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- P letter mark -->
  <g filter="url(#glow)" clip-path="url(#rounded)">
    <!-- Vertical stem -->
    <rect x="128" y="112" width="52" height="288" rx="10" fill="url(#cyan)"/>
    <!-- Top horizontal bar -->
    <rect x="128" y="112" width="184" height="52" rx="10" fill="url(#cyan)"/>
    <!-- Middle horizontal bar -->
    <rect x="128" y="232" width="184" height="52" rx="10" fill="url(#cyan)"/>
    <!-- Right arc top -->
    <rect x="260" y="112" width="52" height="172" rx="26" fill="url(#cyan)"/>
    <!-- Speed slash -->
    <rect x="290" y="270" width="52" height="180" rx="10" transform="rotate(-28 316 360)" fill="url(#cyan)" opacity="0.85"/>
  </g>
</svg>
